<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Соло на клавиатуре</title>
    <link rel="stylesheet" href="task.css">
</head>
<body>
    <header class="header">
        <div class="logo__container">
            <a href="https://netology.ru/" class="logo__link"></a>
        </div>
        <h1 class="header__title">Соло на клавиатуре</h1>
    </header>
    <main class="content">
        <div class="card">
            <div id="game">
                <div class="status">
                    <p>Правильно введённых слов: <span class="status__wins">0</span></p>
                    <p>Неправильно введённых слов: <span class="status__loss">0</span></p>
                    <p>Время: <span id="timer">0</span> сек</p>
                </div>
                <!-- data-word нужен для проверки соответствия вводимого символа коду UTF-16 -->
                <div class="word" id="word-container" data-word=""></div>
            </div>
        </div>
    </main>
    
    <script src="task.js"></script>
</body>
</html>
